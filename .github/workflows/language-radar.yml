name: Update Language Radar

on:
  workflow_dispatch:         # run manually from the Actions tab after editing the scores in scripts/language_radar.py
  push:
    branches: [main]
    paths:
      - "scripts/language_radar.py"

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate language radar SVGs (self-rated scores)
        run: python scripts/language_radar.py language-score

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/radar-langs-dark.svg assets/radar-langs-light.svg
          git diff --staged --quiet || git commit -m "chore: update language radar chart"
          git push
